# SmartBooking — local & demo orchestration
# Usage: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: smartbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbooking
      POSTGRES_PASSWORD: smartbooking
      POSTGRES_DB: smartbooking
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartbooking -d smartbooking']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbooking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://smartbooking:smartbooking@db:5432/smartbooking?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: info
    ports:
      - '4000:4000'

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: smartbooking-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

  prometheus:
    image: prom/prometheus:latest
    container_name: smartbooking-prometheus
    restart: unless-stopped
    profiles: ['monitoring']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: smartbooking-alertmanager
    restart: unless-stopped
    profiles: ['monitoring']
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '9093:9093'

  grafana:
    image: grafana/grafana:latest
    container_name: smartbooking-grafana
    restart: unless-stopped
    profiles: ['monitoring']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  db-data:
  grafana-data:
