global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Règles d'alerte évaluées en continu (Bloc 4, C4.1.2)
rule_files:
  - /etc/prometheus/alert.rules.yml

# Routage des alertes déclenchées vers Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'smartbooking-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:4000']
        labels:
          service: smartbooking-api
